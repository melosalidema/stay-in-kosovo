services:
  db:
    image: postgres:16-alpine
    container_name: stay-kosovo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: stay
      POSTGRES_PASSWORD: stay
      POSTGRES_DB: stay_in_kosovo
    ports:
      - "5432:5432"
    volumes:
      - stay_kosovo_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stay -d stay_in_kosovo"]
      interval: 10s
      timeout: 5s
      retries: 5

  studio:
    image: node:20-alpine
    container_name: stay-kosovo-prisma-studio
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npx prisma studio --host 127.0.0.1 --port 5555"
    environment:
      DATABASE_URL: postgresql://stay:stay@db:5432/stay_in_kosovo?schema=public
    ports:
      - "127.0.0.1:5555:5555"

volumes:
  stay_kosovo_db_dev: