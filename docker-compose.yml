services:
  db:
    image: postgres:16-alpine
    container_name: stay-kosovo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Generate with: openssl rand -hex 16}
      POSTGRES_DB: stay_in_kosovo
    ports:
      - "5432:5432"
    volumes:
      - stay_kosovo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stay -d stay_in_kosovo"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: stay-kosovo-web
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://stay:${POSTGRES_PASSWORD}@db:5432/stay_in_kosovo?schema=public
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  stay_kosovo_db:
